<!DOCTYPE html>

<style>
  /* Sarlavha rangi shu yerda: --hdr (fon), --hdrText (yozuv), --hdrBorder (chegara) */
  :root{--hdr:#DCE6F1;--hdrText:#1F4E79;--hdrBorder:#8FA9C4}
  body{font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.3;margin:16px;color:#111}
  .ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;padding:10px;background:#f2f4f7;border-radius:8px}
  #msg{margin:6px 0;color:#b00020}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:0;border-radius:10px;font:600 14px Arial;cursor:pointer;color:#fff;background:#6b7a90;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:.15s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 5px 12px rgba(0,0,0,.25)}

  /* FB / Ballar / 1 Chorak — 3 qatorga cho'zilgan sarlavhalar, matn vertikal markazda */
  th.vmid{vertical-align:middle}
  td.l{text-align:left}

        background:rgba(255,255,255,.96);font-size:16px;font-weight:bold;color:#1F4E79}

  @page{size:A4 landscape;margin:10mm}

    .ctl,#msg,.busy,#warn{display:none}
    body{margin:0;font-size:11px}
    th,td{padding:2px 5px}
    /* 1-betdagi jadval A4 varaqning butun kengligini egallaydi */
    #page1 table{width:100%}
    .page{page-break-after:always}
    .page:last-child{page-break-after:auto}
  }
</style>
<style id="fit"></style>

<body>
<div class="ctl">
  <label class="btn primary" for="f">📂 <span id="fn">Jurnal tanlash (.xls / .xlsx)</span></label>
  <input type="file" id="f" accept=".xls,.xlsx" hidden>
  <button class="btn green" id="xl">📊 Excel yuklab olish</button>
  <button class="btn gray" onclick="window.print()">🖨 Chop etish</button>
</div>
<div id="warn"></div>
<div id="msg"></div>
<div id="rep"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
/*PARSE_START*/
const txt = v => v == null ? '' : String(v).trim();
const num = v => {
  if (typeof v === 'number') return v;
  const s = txt(v).replace(',', '.');
  return /^\d+(\.\d+)?$/.test(s) ? parseFloat(s) : null;   // 'dq', 's', 'T/O' va h.k. -> null
};

// Baholash turi: o'zbekcha (BSB/CHSB/LI) va ruscha (СОР/СОЧ/ЛИ) yozuvlarni teng qabul qilamiz
const normType = t => {
  const u = txt(t).toUpperCase().replace(/[.\s]/g, '');
  if (u === 'BSB' || u === 'СОР' || u === 'COP') return 'BSB';
  if (u === 'CHSB' || u === 'СОЧ' || u === 'COЧ') return 'CHSB';
  if (['LI','ЛИ','ПР','ПРОЕКТ','ПРОЕКТНАЯРАБОТА','LOYIHA','LOYIHAISHI'].includes(u)) return 'LI';
  return null;
};

// Qo'shimcha ustunlar: FB (baholovchi fikri) va Ballar (umumiy ball)
// Sarlavha matni bo'yicha aniqlanadi, ustun tartibi o'zgarishi mumkin.
const normExtra = t => {
  const u = txt(t).toUpperCase().replace(/[.\s]/g, '');
  if (u === 'FB' || u === 'ФБ') return 'FB';
  if (u === 'BALLAR' || u === 'БАЛЛАР' || u === 'БАЛЛ' || u === 'БАЛЛЫ') return 'BALLAR';
  return null;
};

function parse(rows) {
  const info = {sinf: '', fan: '', fio: ''};
  let ru = false, r0 = -1;
  // 1) Sinf / Fan / FIO va jadval boshi ("X/X №" yoki "№ п/п") ni yorliq matni bo'yicha topamiz
  for (let r = 0; r < rows.length && r0 < 0; r++) {
    (rows[r] || []).forEach(v => {
      const t = txt(v); let m;
      if ((m = t.match(/^(Sinf|Класс)\s*:\s*(\S+)/i))) { info.sinf = m[2]; if (/^Класс/i.test(t)) ru = true; }
      else if ((m = t.match(/^(Fan|Предмет)\s*:\s*(.+)/i))) { info.fan = m[2].trim(); if (/^Предмет/i.test(t)) ru = true; }
      else if ((m = t.match(/^(?:o[‘'’`ʼ]?qituvchining\s+FIO|o[‘'’`ʼ]?qituvchi(?:\s+FIO)?|ustoz(?:\s+FIO)?|FIO|ФИО(?:\s+учителя)?|Учитель)\s*:\s*(.+)/i))) { info.fio = m[1].trim(); if (/^(ФИО|Учитель)/i.test(t)) ru = true; }
      else if ((/^X\/X/i.test(t) || /^№\s*п\/п/i.test(t)) && r0 < 0) r0 = r;
    });
  }
  if (r0 < 0) throw new Error('Jadval boshi ("X/X №" yoki "№ п/п") topilmadi. Bu e-maktab jurnali emasga o‘xshaydi.');

  // 2) Ism ustuni
  let nameCol = 1;
  for (let r = r0; r < r0 + 4; r++)
    (rows[r] || []).forEach((v, c) => {
      if (/ism va familiya|фамилия\s+и\s+имя/i.test(txt(v))) nameCol = c;
    });

  // 3) BSB / CHSB / LI ustunlari: sarlavha matni bo'yicha (joyi har xil bo'lishi mumkin)
  //    qo'shimcha: FB va Ballar ustunlari ham sarlavha matni orqali topiladi
  const cols = []; let chor = null;
  const extra = [];                                    // {type:'FB'|'BALLAR', lbl, c}
  for (let r = r0; r < r0 + 6 && r < rows.length; r++) {
    (rows[r] || []).forEach((v, c) => {
      const t = txt(v);
      const T = normType(t);
      const E = normExtra(t);
      if (T && !cols.find(o => o.c === c)) {
        let max = null;
        for (let k = r + 1; k <= r + 3 && max == null; k++) max = num((rows[k] || [])[c]);
        let date = '';
        for (let k = r - 1; k >= r0 && !date; k--) { const d = txt((rows[k] || [])[c]); if (/\d/.test(d)) date = d; }
        if (/[А-Яа-яЁё]/.test(t)) ru = true;
        cols.push({type: T, lbl: t, c, date, max});
      } else if (E && !extra.find(o => o.c === c)) {
        if (/[А-Яа-яЁё]/.test(t)) ru = true;
        extra.push({type: E, lbl: t, c});
      } else if (!chor && (/^\d+\s*-?\s*(?:chorak|чорак|четверть)/i.test(t) || /^\d*\s*-?\s*ч\s*т\s*в/i.test(t))) {
        chor = {c, label: t};
        if (/[А-Яа-яЁё]/.test(t)) ru = true;
      }
    });
  }
  cols.sort((a, b) => a.c - b.c);
  extra.sort((a, b) => a.c - b.c);

  // 4) O'quvchilar: A ustunida tartib raqami, ism ustunida ism bor qatorlar
  const all = [];
  for (let r = r0 + 1; r < rows.length; r++) {
    const row = rows[r] || [];
    const n = num(row[0]), name = txt(row[nameCol]);
    if (n != null && name) {
      const raw = cols.map(o => txt(row[o.c]));          // BSB / CHSB kataklari (matn ko'rinishida)
      const chRaw = chor ? txt(row[chor.c]) : '';        // chorak katakchasi ("TO", "O'tm", "dq" ham bo'lishi mumkin)
      const exRaw = extra.map(o => txt(row[o.c]));       // FB / Ballar kataklari
      all.push({
        n, name, id: txt(row[nameCol + 1]),
        raw, chRaw, exRaw,                              // ekranda Excelda yozilgani ko'rsatiladi
        sc: cols.map(o => num(row[o.c])),
        ch: chor ? num(row[chor.c]) : null,
        ex: extra.map(o => num(row[o.c])),
        hasAny: raw.some(v => v !== '') || chRaw !== '' || exRaw.some(v => v !== '')
      });
    }
  }

  // 5) Yig'ma ustunlar: BSB (jami 50), CHSB (40), LI (fayldagi maks.), FB (10), JAMI
  const BSB_MAX = 50, CHSB_MAX = 40, FB_MAX = 10;
  const sum = a => { const b = a.filter(v => v != null); return b.length ? b.reduce((x, y) => x + y, 0) : null; };
  const idx = ty => cols.map((o, i) => o.type === ty ? i : -1).filter(i => i >= 0);
  const iB = idx('BSB'), iC = idx('CHSB'), iL = idx('LI');
  const iF = extra.findIndex(o => o.type === 'FB');
  const lb = (ty, def) => { const o = cols.find(o => o.type === ty); return o ? o.lbl : def; };
  const liMax = iL.reduce((a, i) => a + (cols[i].max || 0), 0) || null;
  const vc = [{k: 'BSB', lbl: lb('BSB', ru ? 'СОР' : 'BSB'), max: BSB_MAX}, {k: 'CHSB', lbl: lb('CHSB', ru ? 'СОЧ' : 'CHSB'), max: CHSB_MAX}];
  if (iL.length) vc.push({k: 'LI', lbl: lb('LI', 'LI'), max: liMax});
  vc.push({k: 'FB', lbl: iF >= 0 ? extra[iF].lbl : (ru ? 'ФБ' : 'FB'), max: FB_MAX});
  const jmax = vc.reduce((a, o) => a + (o.max || 0), 0);
  vc.push({k: 'JAMI', lbl: ru ? 'Итого' : 'JAMI', max: jmax});
  all.forEach(s => {
    const v = {BSB: sum(iB.map(i => s.sc[i])), CHSB: sum(iC.map(i => s.sc[i])), LI: sum(iL.map(i => s.sc[i])), FB: iF >= 0 ? s.ex[iF] : null};
    v.JAMI = sum([v.BSB, v.CHSB, v.LI, v.FB]);
    s.v = vc.map(o => v[o.k]);
  });

  // 6) Choraklik bahosi bo'sh o'quvchilar jadvaldan tushiriladi (T/O, OZ kabilar qoladi)
  const dropped = chor ? all.filter(s => s.chRaw === '') : [];
  const st = chor ? all.filter(s => s.chRaw !== '') : all;
  st.forEach((s, i) => s.n = i + 1);
  dropped.forEach((s, i) => s.n = i + 1);
  return {info, cols: vc, chor, extra: [], st, dropped, removed: dropped.length, ru, jmax};
}
/*PARSE_END*/

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// O'quvchilar ko'p bo'lsa, 1-betga (A4 landscape) sig'ishi uchun shriftni kichraytiramiz
const fitFont = n => n > 45 ? 9 : n > 38 ? 10 : n > 30 ? 11 : 12;
let cur = null, RU = false;
const L = (u, r) => RU ? r : u;
const fm = v => v == null ? '' : Math.round(v * 100) / 100;

function barChart(title, items, opt = {}) {
  const n = Math.max(1, items.length);
  const W = opt.W || Math.max(420, 30 + n * 100);
  const H = 320, base = H - 50, top = 55;
  const mx = opt.axisMax || Math.max(1, ...items.map(i => i.value));
  const barColors = ['#d9534f', '#f0ad4e', '#5bc0de', '#5cb85c', '#9aa3ad'];
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="Arial">`;
  s += `<rect width="${W}" height="${H}" fill="#ffffff"/>`;
  s += `<text x="${W/2}" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F4E79">${esc(title)}</text>`;
  s += `<line x1="30" y1="${base}" x2="${W-20}" y2="${base}" stroke="#888"/>`;
  for (let p = 0; p <= mx; p += Math.max(1, Math.ceil(mx / 5))) {
    const y = base - (base - top) * p / mx;
    s += `<line x1="30" y1="${y}" x2="${W-20}" y2="${y}" stroke="#e3e7ee"/>`;
    s += `<text x="24" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#555">${p}</text>`;
  }
  const step = (W - 50) / n;
  const bw = Math.min(60, step - 20);
  items.forEach((it, i) => {
    const x = 30 + i * step + (step - bw) / 2;
    const bh = (base - top) * it.value / mx;
    const y = base - bh;
    const color = it.color || barColors[i % barColors.length];
    s += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${color}" rx="3"/>`;
    s += `<text x="${x + bw/2}" y="${y - 7}" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">${esc(it.top ?? it.value)}</text>`;
    s += `<text x="${x + bw/2}" y="${base + 16}" text-anchor="middle" font-size="11" fill="#111">${esc(it.label)}</text>`;
  });
  return s + '</svg>';
}

// Hisobot uchun diagrammalar: baholar taqsimoti + BSB/CHSB o'rtacha o'zlashtirish
// Har bir o'quvchi uchun BSB / CHSB foizi: bir nechta ish bo'lsa — ballar qo'shilib, umumiy maksimalga nisbatan
function pctByType(d, s, type) {
  let got = 0, max = 0, any = false;
  d.cols.forEach((o, i) => {
    if (o.type !== type || !o.max) return;
    max += o.max;
    const v = s.sc[i];
    if (v != null) { got += v; any = true; }
  });
  return (max && any) ? Math.round(got / max * 100) : null;
}

const shortName = nm => {
  const w = String(nm).trim().split(/\s+/);
  return w.length > 1 ? w[0] + ' ' + w[1][0] + '.' : w[0];
};

// Har bir o'quvchi uchun JAMI ball — bitta ustun
function studentChart(d) {
  const st = d.st; if (!st.length) return '';
  const ji = d.cols.length - 1, mx = d.jmax || 100;
  const step = Math.max(30, Math.min(60, 1100 / st.length));
  const LM = 50, R = 14, T = 50, B = 90;
  const W = Math.round(LM + step * st.length + R), H = 340, base = H - B, plotH = base - T;
  const y = p => base - plotH * p / mx;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="Arial">`;
  s += `<rect width="${W}" height="${H}" fill="#ffffff"/>`;
  s += `<text x="${LM}" y="22" font-size="14" font-weight="bold" fill="#1F4E79">${L('O‘quvchilar bo‘yicha umumiy ball (JAMI)', 'Общий балл по ученикам (Итого)')}</text>`;
  for (let k = 0; k <= 5; k++) {
    const p = mx * k / 5, yy = y(p);
    s += `<line x1="${LM}" y1="${yy.toFixed(1)}" x2="${W-R}" y2="${yy.toFixed(1)}" stroke="#e3e7ee"/>`;
    s += `<text x="${LM-6}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="#555">${Math.round(p)}</text>`;
  }
  s += `<line x1="${LM}" y1="${base}" x2="${W-R}" y2="${base}" stroke="#888"/>`;
  const bw = Math.max(10, Math.min(28, step * 0.6));
  st.forEach((s2, i) => {
    const cx = LM + step * i + step / 2, v = s2.v[ji] == null ? 0 : s2.v[ji], yy = y(v);
    if (v > 0) s += `<rect x="${(cx-bw/2).toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${(base-yy).toFixed(1)}" fill="#5b9bd5" rx="2"/>`;
    if (s2.v[ji] != null) s += `<text x="${cx.toFixed(1)}" y="${(yy-5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">${fm(v)}</text>`;
    const nm = step >= 38 ? String(s2.name) : shortName(s2.name);
    s += `<text x="${cx.toFixed(1)}" y="${base+12}" text-anchor="end" font-size="10" fill="#111" transform="rotate(-45 ${cx.toFixed(1)} ${base+12})">${esc(nm)}</text>`;
  });
  return s + '</svg>';
}

function buildCharts(d) {
  const {st} = d;
  const cnt = g => st.filter(s => g === null ? s.ch == null : s.ch === g).length;
  const rowsF = [5, 4, 3, 2, 1].map(g => [L(g + ' baho olgan o‘quvchilar', 'Ученики с оценкой ' + g), g]);
  rowsF.push([L('Baho yo‘q (T/O, OZ va h.k.)', 'Без оценки (Т/О, ОЗ и др.)'), null]);
  const colors = {null: '#9aa3ad', 1: '#a94442', 2: '#d9534f', 3: '#f0ad4e', 4: '#5bc0de', 5: '#5cb85c'};
  const gradeSvg = barChart(L('Choraklik baholar diagrammasi', 'Диаграмма четвертных оценок'),
    rowsF.map(([lab, g]) => ({label: g === null ? L('Yo‘q', 'Нет') : String(g), value: cnt(g), color: colors[g]})), {W: 480});
  return {rowsF, cnt, gradeSvg, stSvg: studentChart(d)};
}

// Ekran boshida: choraklik bahosi yo'q o'quvchilar haqida ogohlantirish
function showWarn(d) {
  const w = $('warn');
  if (!d.dropped.length) { w.innerHTML = ''; return; }
  let h = `<div class="warnbox"><b>⚠ ${L('Choraklik bahosi yo‘q ' + d.dropped.length + ' nafar o‘quvchi jadvaldan tushirib qoldirildi:', 'У ' + d.dropped.length + ' учеников нет четвертной оценки — они исключены из таблицы:')}</b><table><tr class="hdr"><th>№</th><th>${L('Ism va familiya', 'Фамилия и имя')}</th>`;
  d.cols.forEach(o => h += `<th>${esc(o.lbl)}</th>`);
  h += '</tr>';
  d.dropped.forEach(s => { h += `<tr><td>${s.n}</td><td class="l">${esc(s.name)}</td>` + s.v.map(v => `<td>${fm(v)}</td>`).join('') + '</tr>'; });
  w.innerHTML = h + '</table></div>';
}

function render(d) {
  const {info, cols, chor, extra, st, ru} = d;
  RU = ru;
  // N — umumiy ustunlar soni: №, Ism, BSB/CHSB juftlari, FB, Ballar, 1 Chorak
  const N = 2 + cols.length + (chor ? 1 : 0);

  /* ---------------- 1-BET: o'quvchilar jadvali ---------------- */
  let h = '<div class="page" id="page1"><table>';
  h += `<tr><td class="info" colspan="${N}">${ru ? 'Класс' : 'Sinf'}: ${esc(info.sinf)}</td></tr>`;
  h += `<tr><td class="info" colspan="${N}">${ru ? 'Предмет' : 'Fan'}: ${esc(info.fan)}</td></tr>`;
  h += `<tr><td class="info" colspan="${N}">${ru ? 'ФИО учителя' : 'o‘qituvchining FIO'}: ${esc(info.fio)}</td></tr>`;
  h += `<tr><td class="info" colspan="${N}">&nbsp;</td></tr>`;
  h += `<tr class="hdr"><th>${ru ? '№ п/п' : 'X/X №'}</th><th>${ru ? 'Фамилия и имя ученика' : 'O‘quvchining ism va familiyasi'}</th>`;
  cols.forEach(o => h += `<th>${esc(o.lbl)}<br><small>(${o.max ?? '?'})</small></th>`);
  if (chor) h += `<th>${esc(chor.label)}</th>`;
  h += '</tr>';
  st.forEach(s => {
    h += `<tr><td>${s.n}</td><td class="l">${esc(s.name)}</td>`;
    cols.forEach((o, i) => h += `<td${o.k === 'JAMI' ? ' style="font-weight:bold"' : ''}>${fm(s.v[i])}</td>`);
    if (chor) h += `<td>${esc(s.chRaw)}</td>`;
    h += '</tr>';
  });
  h += '</table></div>';

  /* ---------------- 2-BET: hisobot va diagrammalar ---------------- */
  const C = buildCharts(d);

  h += '<div class="page" id="page2"><div class="h2">' + L(L('Hisobot', 'Отчёт'), 'Отчёт') + '</div>';
  h += '<div class="report-layout">';
  h += '<div class="left-panel">';
  if (C.stSvg) h += '<div class="chart-wrap st-chart">' + C.stSvg + '</div>';
  h += '</div>';
  h += '<div class="right-panel">';
  h += '<table><tr class="hdr"><th>' + L(L('Ko‘rsatkich', 'Показатель'), 'Показатель') + '</th><th>' + L(L('O‘quvchilar soni', 'Кол-во учеников'), 'Кол-во учеников') + '</th></tr>';
  h += `<tr><td class="l">${L(L('Jami o‘quvchilar', 'Всего учеников'), 'Всего учеников')}</td><td>${st.length}</td></tr>`;
  C.rowsF.forEach(([lab, g]) => h += `<tr><td class="l">${lab}</td><td>${C.cnt(g)}</td></tr>`);
  h += '</table>';
  h += '<div class="chart-wrap">' + C.gradeSvg + '</div>';
  h += '</div>';
  h += '</div>';
  h += '</div>';

  // 1-bet bitta varaqqa sig'ishi uchun chop etish shriftini moslaymiz
  const fs = fitFont(st.length);
  $('fit').textContent = `@media print{body{font-size:${fs}px}th,td{padding:${fs <= 11 ? 1 : 2}px 4px}}`;

  $('rep').innerHTML = h;
}

$('f').onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  $('fn').textContent = file.name;
  $('msg').textContent = '';
  try {
    if (!window.XLSX) throw new Error('Excel o‘qish kutubxonasi yuklanmadi. Internetga ulanib, sahifani qayta oching.');
    const wb = XLSX.read(await file.arrayBuffer(), {type: 'array'});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, raw: true, defval: null});
    cur = parse(rows);
    render(cur);
    const notes = [];
    if (!cur.chor) notes.push('Diqqat: chorak ustuni topilmadi.');
    showWarn(cur);
    if (!cur.st.length) notes.push('Ro‘yxatda o‘quvchi qolmadi: BSB, CHSB va chorak kataklari bo‘sh.');
    $('msg').textContent = notes.join(' ');
  } catch (err) { $('rep').innerHTML = ''; $('warn').innerHTML = ''; $('msg').textContent = err.message; }
};

function xlsxFileName() {
  const p = ['hisobot', cur?.info?.sinf, cur?.info?.fan].filter(Boolean).join('_');
  return (p || 'hisobot').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, '_') + '.xlsx';
}

/* ===================== EXCEL (.xlsx) yuklab olish ===================== */
const XL_BORDER = {style: 'thin', color: {argb: 'FF666666'}};
const XL_BORDERS = {top: XL_BORDER, left: XL_BORDER, bottom: XL_BORDER, right: XL_BORDER};
const XL_FILL = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FFDCE6F1'}};
const XL_CENTER = {horizontal: 'center', vertical: 'middle', wrapText: true};

function xlColName(n) {
  let s = '';
  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

// SVG diagrammani PNG rasmga aylantiramiz (Excelga joylash uchun)
function svgToPng(svg, scale = 2) {
  const m = svg.match(/viewBox="0 0 (\d+) (\d+)"/) || [];
  const w = +m[1] || 340, h = +m[2] || 300;
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = w * scale; c.height = h * scale;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      resolve({base64: c.toDataURL('image/png').split(',')[1], w, h});
    };
    img.onerror = () => reject(new Error('Diagrammani rasmga aylantirib bo‘lmadi.'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

$('xl').onclick = async () => {
  if (!cur || !cur.st.length) { $('msg').textContent = 'Avval jurnal faylini tanlang.'; return; }
  const overlay = document.createElement('div');
  overlay.className = 'busy';
  overlay.textContent = 'Excel tayyorlanmoqda, biroz kuting…';
  document.body.appendChild(overlay);
  try {
    if (!window.ExcelJS) throw new Error('Excel yozish kutubxonasi yuklanmadi. Internetga ulanib, sahifani qayta oching.');
    const {info, cols, chor, extra, st, ru} = cur;
    RU = ru;
    const C = buildCharts(cur);
    const wb = new ExcelJS.Workbook();
    wb.creator = 'BSB / CHSB hisobot';
    const ws = wb.addWorksheet(L('Hisobot', 'Отчёт'));
    // ExcelJS 4.4.0 views yozilmasa <sheetViews> tushib qoladi va Excel
    // qator balandliklarini 2/3 qilib ko‘rsatadi — shuning uchun ochiq beriladi
    ws.views = [{showGridLines: true}];

    // A4, yotiq; 1-bet (jadval) va 2-bet (hisobot) aniq 2 betga chiqadi
    ws.pageSetup.paperSize = 9;                 // 9 = A4
    ws.pageSetup.orientation = 'landscape';
    ws.pageSetup.horizontalCentered = true;
    ws.pageSetup.margins = {left: 0.3, right: 0.3, top: 0.4, bottom: 0.4, header: 0.2, footer: 0.2};

    // ---- A4 yotiq (297 x 210 mm): matn qirqilmasin, kerak bo‘lsa masshtab kichrayadi ----
    const AVAIL_W_PX = 1020;                    // A4 yotiq chop etish maydoni kengligi (px, 96 dpi)
    const AVAIL_H_PT = 537;                     // A4 yotiq, 0.4" chegara bilan chop etish balandligi (pt)

    const nCols = 2 + cols.length + (chor ? 1 : 0);
    const lastCol = Math.max(nCols, 8);         // diagrammalar ham shu ustunlarga sig‘adi
    const numCols = Math.max(1, nCols - 2);
    const extraCols = lastCol - nCols;

    // Ustun kengliklari — jadval varaqning butun kengligini egallaydi
    const totalChars = (AVAIL_W_PX - 5 * nCols) / 7;
    const wNum = Math.max(8.43, Math.min(26, (totalChars - 7 - 34 - 3 * extraCols) / numCols));
    ws.getColumn(1).width = 7;
    ws.getColumn(2).width = 34;
    for (let cc = 3; cc <= nCols; cc++) ws.getColumn(cc).width = wNum;
    for (let cc = nCols + 1; cc <= lastCol; cc++) ws.getColumn(cc).width = 3;

    // Qator balandliklari — matn qirqilib qolmaydigan minimal o‘lchamlar
    const H_INFO = 24, H_BLANK = 6, H_HDR = 30, H_DATA = 18;
    const FS = 11;                                                  // jadval shrifti
    const needH = 3 * H_INFO + 2 * H_BLANK + H_HDR + st.length * H_DATA;
    // Sig‘masa qatorlarni siqmaymiz — chop etish masshtabini kichraytiramiz
    const printScale = Math.max(50, Math.min(100, Math.floor(100 * (AVAIL_H_PT - H_BLANK) / needH)));

    // Qator balandliklari (Excel o‘zi cho‘zib yubormasligi uchun aniq beriladi)
    for (let r = 1; r <= 3; r++) ws.getRow(r).height = H_INFO;
    ws.getRow(4).height = H_BLANK;

    // Sinf / Fan / FIO — varaqning butun kengligi bo‘ylab markazga
    [[1, (ru ? 'Класс: ' : 'Sinf: ') + info.sinf], [2, (ru ? 'Предмет: ' : 'Fan: ') + info.fan],
     [3, (ru ? 'ФИО учителя: ' : 'o‘qituvchining FIO: ') + info.fio]].forEach(([r, v]) => {
      const cell = ws.getCell(r, 1);
      cell.value = v;
      cell.font = {bold: true, size: 12, color: {argb: 'FF1F4E79'}};
      cell.alignment = {horizontal: 'center', vertical: 'middle'};
      ws.mergeCells(r, 1, r, nCols);
    });

    const H = 5;
    ws.getCell(H, 1).value = ru ? '№ п/п' : 'X/X №';
    ws.getCell(H, 2).value = ru ? 'Фамилия и имя ученика' : 'O‘quvchining ism va familiyasi';
    cols.forEach((o, i) => ws.getCell(H, 3 + i).value = o.lbl + ' (' + (o.max ?? '?') + ')');
    if (chor) ws.getCell(H, 3 + cols.length).value = chor.label;
    ws.getRow(H).height = H_HDR;
    for (let cc = 1; cc <= nCols; cc++) {
      const cell = ws.getCell(H, cc);
      cell.font = {bold: true, color: {argb: 'FF1F4E79'}}; cell.fill = XL_FILL; cell.alignment = XL_CENTER; cell.border = XL_BORDERS;
    }
    const first = H + 1;
    st.forEach((s, ri) => {
      const r = first + ri;
      ws.getRow(r).height = H_DATA;
      ws.getCell(r, 1).value = s.n;
      ws.getCell(r, 2).value = s.name;
      cols.forEach((o, i) => { const v = s.v[i]; ws.getCell(r, 3 + i).value = v == null ? null : Math.round(v * 100) / 100; });
      if (chor) ws.getCell(r, 3 + cols.length).value = s.chRaw === '' ? null : (s.ch != null ? s.ch : s.chRaw);
      for (let cc = 1; cc <= nCols; cc++) {
        const cell = ws.getCell(r, cc);
        cell.alignment = cc === 2 ? {horizontal: 'left', vertical: 'middle', wrapText: true} : XL_CENTER;
        cell.border = XL_BORDERS;
      }
      ws.getCell(r, 2 + cols.length).font = {bold: true};   // JAMI
    });
    const lastData = first + st.length - 1;

    /* ===== Hisobot varag'i: 1-qism — jadval, 2-qism — hisobot + diagrammalar ===== */
    // Shrift o‘lchamlari — jadval (1-qism) matni qirqilib qolmasin
    for (let r = 1; r <= lastData; r++) {
      const isInfo = r <= 3, isHdr = r === H;
      for (let cc = 1; cc <= nCols; cc++) {
        const cell = ws.getCell(r, cc);
        if (cell.value == null) continue;
        cell.font = Object.assign({}, cell.font || {}, {
          size: isInfo ? Math.min(12, FS + 2) : isHdr ? Math.min(12, FS + 1) : FS
        });
      }
    }

    // 1-qism (jadval) va 2-qism (hisobot) orasida bo‘sh joy + sahifa uzilishi
    ws.getRow(lastData + 1).height = H_BLANK;
    ws.getRow(lastData + 2).height = H_BLANK;
    ws.rowBreaks = [{id: lastData + 2, max: 16383, man: 1}];

    // ===== 2-qism: Hisobot + diagrammalar (xuddi shu varaqda, jadval ostida) =====
    const hTitleRow = lastData + 3;          // "Hisobot" sarlavhasi (1-asosli)
    let sr = hTitleRow;
    ws.getCell(sr, 1).value = L('Hisobot', 'Отчёт');
    ws.getCell(sr, 1).font = {bold: true, size: 14, color: {argb: 'FF1F4E79'}};
    ws.getRow(sr).height = 24;
    sr++;

    ws.mergeCells(sr, 1, sr, 2);
    ws.getCell(sr, 1).value = L('Ko‘rsatkich', 'Показатель');
    ws.getCell(sr, 3).value = L('O‘quvchilar soni', 'Кол-во учеников');
    [1, 3].forEach(cc => {
      const cell = ws.getCell(sr, cc);
      cell.font = {bold: true, color: {argb: 'FF1F4E79'}};
      cell.fill = XL_FILL;
      cell.border = XL_BORDERS;
      cell.alignment = cc === 1
        ? {horizontal: 'left', vertical: 'middle'}
        : {horizontal: 'center', vertical: 'middle', wrapText: true};
    });
    ws.getCell(sr, 2).border = XL_BORDERS;
    ws.getRow(sr).height = 20;
    sr++;

    const sumStart = sr;
    ws.mergeCells(sr, 1, sr, 2);
    ws.getCell(sr, 1).value = L('Jami o‘quvchilar', 'Всего учеников');
    ws.getCell(sr, 3).value = st.length;
    sr++;
    C.rowsF.forEach(([lab, g]) => {
      ws.mergeCells(sr, 1, sr, 2);
      ws.getCell(sr, 1).value = lab;
      ws.getCell(sr, 3).value = C.cnt(g);
      sr++;
    });
    for (let r = sumStart; r <= sr - 1; r++) {
      ws.getRow(r).height = 20;
      ws.getCell(r, 1).alignment = {horizontal: 'left', vertical: 'middle'};
      ws.getCell(r, 3).alignment = {horizontal: 'center', vertical: 'middle'};
      ws.getCell(r, 1).border = XL_BORDERS;
      ws.getCell(r, 2).border = XL_BORDERS;
      ws.getCell(r, 3).border = XL_BORDERS;
    }
    const hStatsEnd = sr - 1;

    // 1-diagramma (baholar) — ko‘rsatkichlar jadvalining o‘ng tomonida (D ustunidan)
    const g1 = await svgToPng(C.gradeSvg, 3);
    let availRightPx = 0;
    for (let cc = 4; cc <= lastCol; cc++) {
      availRightPx += (ws.getColumn(cc).width || 8.43) * 7 + 5;
    }
    const imgW1 = Math.round(Math.max(220, Math.min(260, availRightPx - 14)));
    const imgH1 = Math.round(imgW1 * g1.h / g1.w);
    ws.addImage(wb.addImage({base64: g1.base64, extension: 'png'}),
      {tl: {nativeCol: 3, nativeColOff: 20 * 9525, nativeRow: hTitleRow - 1, nativeRowOff: 0},
       ext: {width: imgW1, height: imgH1}});

    // 1-diagramma qaysi qatorgacha cho‘zilishini aniqlash (qator balandliklari bo‘yicha)
    const gradeHpt = imgH1 * 72 / 96;
    let accH = 0, gradeEndRow = hTitleRow;
    while (accH < gradeHpt) {
      accH += (ws.getRow(gradeEndRow).height || 15);
      if (accH < gradeHpt) gradeEndRow++;
    }

    // 2-diagramma (o‘quvchilar bo‘yicha) — pastda, butun kenglikda; yuqoridagi blokdan kattaroq bo‘sh joy bilan
    const gapRow = Math.max(hStatsEnd, gradeEndRow) + 1;
    ws.getRow(gapRow).height = 90;
    let printEnd = gapRow + 1;
    if (C.stSvg) {
      const g2 = await svgToPng(C.stSvg, 3);
      const imgW2 = Math.round(Math.min(AVAIL_W_PX - 20, g2.w));
      const imgH2 = Math.round(imgW2 * g2.h / g2.w);
      const hStudentRow = gapRow + 1;
      ws.addImage(wb.addImage({base64: g2.base64, extension: 'png'}),
        {tl: {col: 0, row: hStudentRow - 1}, ext: {width: imgW2, height: imgH2}});
      printEnd = hStudentRow + Math.ceil(imgH2 / 20) + 1;
    } else {
      printEnd = gapRow + Math.ceil(imgH1 / 20) + 1;
    }

    // Butun varaq (jadval + hisobot) — Times New Roman
    for (let r = 1; r <= printEnd; r++) {
      for (let cc = 1; cc <= lastCol; cc++) {
        const cell = ws.getCell(r, cc);
        if (cell.value == null) continue;
        const f = Object.assign({}, cell.font || {}, {name: 'Times New Roman', family: 1});
        delete f.scheme;
        cell.font = f;
      }
    }

    // A4 yotiq: aniq masshtab + qo‘lda sahifa uzilishi —
    // 1-bet faqat jadval, 2-bet hisobot + diagrammalar
    ws.pageSetup.fitToPage = false;
    ws.pageSetup.scale = printScale;
    ws.pageSetup.printArea = 'A1:' + xlColName(lastCol) + printEnd;

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = xlsxFileName();
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    $('msg').textContent = '';
  } catch (err) {
    $('msg').textContent = err.message;
  } finally {
    overlay.remove();
  }
};
</script>
