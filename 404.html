<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Sahifa topilmadi — Maktab Hisobot</title>
    <link rel="icon" type="image/png" href="/maktabhisobot_icon.svg.png">
    <style>
        :root{color-scheme:light}
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#f5f7fa 0%,#eaf3fd 55%,#e0efff 100%);font:15px/1.55 system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:#14213a}
        .card{width:100%;max-width:520px;background:#fff;border:1px solid #dbe6f3;border-radius:16px;padding:34px 30px;text-align:center;box-shadow:0 18px 50px rgba(20,33,58,.10)}
        .logo{display:inline-flex;align-items:baseline;gap:5px;margin-bottom:18px;font-size:20px;font-weight:700;color:#182361;text-decoration:none}
        .logo span{font-weight:400}
        .code{font-size:64px;line-height:1;font-weight:800;letter-spacing:-.04em;color:#0072bc;margin:0 0 8px}
        h1{font-size:1.25rem;margin:0 0 8px}
        p{margin:0 auto 22px;max-width:38ch;color:#5b6a82}
        .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
        .btn{display:inline-block;padding:11px 18px;border-radius:8px;background:#0072bc;color:#fff;text-decoration:none;font-weight:700;border:1px solid #0072bc}
        .btn:hover{background:#0063a3;border-color:#0063a3}
        .btn.o{background:#fff;color:#0072bc}
        .btn.o:hover{background:#f0f7ff}
        .hint{margin:18px 0 0;font-size:.78rem;color:#8a97a8}
    </style>
</head>
<body>
    <main class="card">
        <a class="logo" href="/">maktab<span>hisobot</span></a>
        <p class="code">404</p>
        <h1>Sahifa topilmadi</h1>
        <p>Kechirasiz, siz izlagan sahifa mavjud emas yoki manzili o'zgargan bo'lishi mumkin.</p>
        <div class="actions">
            <a class="btn" href="/">Bosh sahifa</a>
            <a class="btn o" href="/bsb">BSB hisobot</a>
            <a class="btn o" href="/choraklik">Choraklik hisobot</a>
        </div>
        <p class="hint">maktabhisobot.uz</p>
    </main>
</body>
</html>
